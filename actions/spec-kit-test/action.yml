# mz: spec-kit — composite action: run ZAgents Executable Spec Kit tests on the
# caller's checkout and report results. Published to the public
# ZurabDev/zagents-releases repo at actions/spec-kit-test/ by the
# sync-public-repo job (release-fork.yml); used as
#   uses: ZurabDev/zagents-releases/actions/spec-kit-test@v1
name: ZAgents Spec Kit tests
description: Run the spec tests of a ZAgents project (deploy / PR / nightly gate) in this checkout and report results to ZAgents.
author: ZAgents
branding:
  icon: check-square
  color: purple

inputs:
  token:
    description: Workspace API token (store as the ZAGENTS_TOKEN secret).
    required: true
  gate:
    description: "Gate: deploy, pr, nightly, manual or all."
    required: false
    default: pr
  project:
    description: Project id, key or title.
    required: false
    default: ""
  component:
    description: Component <domain>.<component>.
    required: false
    default: ""
  spec:
    description: Spec ref (SPEC-014).
    required: false
    default: ""
  issue:
    description: Issue key (PRC-100).
    required: false
    default: ""
  tags:
    description: Tags, comma or newline separated (any of).
    required: false
    default: ""
  fail-on:
    description: "Fail the step when a test of this gate fails: deploy, pr or any (default: from gate)."
    required: false
    default: ""
  parallel:
    description: Batches to run at the same time.
    required: false
    default: "1"
  working-directory:
    description: Checkout root the tests run in.
    required: false
    default: "."
  junit-dir:
    description: Keep JUnit files in this directory (for artifacts).
    required: false
    default: ""
  upload-junit:
    description: "Upload the JUnit files as a workflow artifact (true/false); uses junit-dir or a temporary directory."
    required: false
    default: "false"
  artifact-name:
    description: Name of the JUnit artifact.
    required: false
    default: zagents-spec-tests-junit
  server-url:
    description: ZAgents server URL.
    required: false
    default: https://zagents.cnt.me
  workspace-id:
    description: Workspace id, when the token is not bound to one.
    required: false
    default: ""
  cli-version:
    description: zagents CLI version to install (default latest).
    required: false
    default: ""
  args:
    description: "Extra flags for `zagents spec test run`, shell-quoted (e.g. --include-unapproved --tag 'smoke test'); one flag per line also works."
    required: false
    default: ""

outputs:
  exit-code:
    description: Exit code of `zagents spec test run`.
    value: ${{ steps.run.outputs.exit-code }}
  result-file:
    description: Path of the JSON result (`--output json`).
    value: ${{ steps.run.outputs.result-file }}
  passed:
    description: Number of passed spec tests.
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Number of failed spec tests.
    value: ${{ steps.run.outputs.failed }}
  junit-dir:
    description: Directory with the JUnit files of the run.
    value: ${{ steps.run.outputs.junit-dir }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ZAGENTS_TOKEN: ${{ inputs.token }}
        ZAGENTS_SERVER_URL: ${{ inputs.server-url }}
        ZAGENTS_WORKSPACE_ID: ${{ inputs.workspace-id }}
        ZAGENTS_CLI_VERSION: ${{ inputs.cli-version }}
        IN_GATE: ${{ inputs.gate }}
        IN_PROJECT: ${{ inputs.project }}
        IN_COMPONENT: ${{ inputs.component }}
        IN_SPEC: ${{ inputs.spec }}
        IN_ISSUE: ${{ inputs.issue }}
        IN_TAGS: ${{ inputs.tags }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_PARALLEL: ${{ inputs.parallel }}
        IN_JUNIT_DIR: ${{ inputs.junit-dir }}
        IN_UPLOAD: ${{ inputs.upload-junit }}
        IN_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        script="$GITHUB_ACTION_PATH/spec-kit-test.sh"
        [ -f "$script" ] || script="$GITHUB_ACTION_PATH/../../../scripts/spec-kit-test.sh"
        args=(--gate "$IN_GATE" --parallel "$IN_PARALLEL" --output json)
        [ -n "$IN_PROJECT" ] && args+=(--project "$IN_PROJECT")
        [ -n "$IN_COMPONENT" ] && args+=(--component "$IN_COMPONENT")
        [ -n "$IN_SPEC" ] && args+=(--spec "$IN_SPEC")
        [ -n "$IN_ISSUE" ] && args+=(--issue "$IN_ISSUE")
        [ -n "$IN_FAIL_ON" ] && args+=(--fail-on "$IN_FAIL_ON")
        junit_dir="$IN_JUNIT_DIR"
        if [ -z "$junit_dir" ] && [ "$IN_UPLOAD" = "true" ]; then
          junit_dir="$RUNNER_TEMP/zagents-spec-tests-junit"
        fi
        [ -n "$junit_dir" ] && args+=(--junit-dir "$junit_dir")
        # Tags: comma or newline separated; trimmed without xargs so quotes survive.
        while IFS= read -r tag; do
          tag="${tag#"${tag%%[![:space:]]*}"}"
          tag="${tag%"${tag##*[![:space:]]}"}"
          [ -n "$tag" ] && args+=(--tag "$tag")
        done < <(printf '%s\n' "$IN_TAGS" | tr ',' '\n')
        # Extra args: shell-style quoting ('a b', "a b", a\ b) without eval;
        # an unbalanced quote fails the step instead of splitting silently.
        if [ -n "$IN_ARGS" ]; then
          extra_file="$RUNNER_TEMP/zagents-spec-args"
          if ! printf '%s\n' "$IN_ARGS" | xargs printf '%s\0' > "$extra_file"; then
            echo "::error::args: unbalanced quotes"
            exit 2
          fi
          while IFS= read -r -d '' a; do [ -n "$a" ] && args+=("$a"); done < "$extra_file"
        fi
        result="$RUNNER_TEMP/zagents-spec-tests.json"
        # The step shell runs with -e: keep the exit code instead of aborting
        # before the outputs, the summary and the JUnit upload.
        code=0
        bash "$script" "${args[@]}" > "$result" || code=$?
        passed=0
        failed=0
        if command -v jq >/dev/null 2>&1 && jq -e . "$result" >/dev/null 2>&1; then
          passed=$(jq '[(.results // [])[] | select(.status == "pass")] | length' "$result")
          failed=$(jq '[(.results // [])[] | select(.status == "fail")] | length' "$result")
          # Annotate every failed test (path + reason) on the run page.
          jq -r '(.results // [])[] | select(.status == "fail") | "::error file=\(.path // "")::\(.ref) (\(.source)): \((.actual // "failed") | split("\n")[0])"' "$result" || true
        fi
        {
          echo "exit-code=$code"
          echo "result-file=$result"
          echo "passed=$passed"
          echo "failed=$failed"
          echo "junit-dir=$junit_dir"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### ZAgents spec tests (gate: ${IN_GATE})"
          echo
          if command -v jq >/dev/null 2>&1 && jq -e . "$result" >/dev/null 2>&1; then
            jq -r '
              "| Test | Status | Duration | Gate | Path |",
              "|---|---|---|---|---|",
              ((.results // [])[] | "| \(.ref) | \(if .status == "fail" then "❌ fail" elif .status == "pass" then "✅ pass" else "➖ none" end) | \(if .duration_ms then "\(.duration_ms)ms" else "-" end) | \(.gate // "-") | `\(.path // "-")` |"),
              "",
              "\((.results // []) | map(select(.status == "pass")) | length) passed, \((.results // []) | map(select(.status == "fail")) | length) failed, \((.unmatched // []) | length) without a run command."' "$result"
          else
            echo '```'
            cat "$result"
            echo '```'
          fi
          echo
          echo "Exit code: \`$code\`"
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$result"
        exit "$code"

    - name: Upload JUnit files
      if: ${{ always() && inputs.upload-junit == 'true' && steps.run.outputs.junit-dir != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.junit-dir }}
        if-no-files-found: warn
